<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" fill="#f5f5f7" rx="20"/>
  <!-- Switch Body -->
  <rect x="75" y="45" width="150" height="210" rx="16" fill="#ffffff" stroke="#e11a22" stroke-width="4"/>
  <!-- Rocker Button Top -->
  <rect x="90" y="60" width="120" height="85" rx="8" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2"/>
  <text x="150" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#777777" text-anchor="middle">ON / ▲</text>
  <!-- Rocker Button Bottom -->
  <rect x="90" y="155" width="120" height="85" rx="8" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2"/>
  <text x="150" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#777777" text-anchor="middle">OFF / ▼</text>
  <!-- LED / Reset Indicator -->
  <circle cx="150" cy="150" r="7" fill="#e11a22"/>
  <!-- Waves indicating pairing signal -->
  <path d="M 50 120 A 40 40 0 0 0 50 180" fill="none" stroke="#e11a22" stroke-width="3" stroke-linecap="round"/>
  <path d="M 40 105 A 60 60 0 0 0 40 195" fill="none" stroke="#e11a22" stroke-width="3" stroke-linecap="round"/>
  <path d="M 250 120 A 40 40 0 0 1 250 180" fill="none" stroke="#e11a22" stroke-width="3" stroke-linecap="round"/>
  <path d="M 260 105 A 60 60 0 0 1 260 195" fill="none" stroke="#e11a22" stroke-width="3" stroke-linecap="round"/>
</svg>
