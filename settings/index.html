<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 14px; }
    legend { font-weight: 600; padding: 0 6px; }
    label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    p.hint { color: #777; font-size: 12px; margin: 8px 0 0; }
  </style>
</head>
<body>
  <fieldset>
    <legend data-i18n="settings.diagnostics">Diagnostics</legend>
    <label>
      <input id="debugLogs" type="checkbox" />
      <span>Enable verbose HAP debug logging</span>
    </label>
    <p class="hint">
      Logs every HAP request, event and subscription in detail. Only enable this when
      collecting diagnostics — it is noisy and slightly slows down the hot path.
    </p>
  </fieldset>

  <script>
    function onHomeyReady(Homey) {
      var el = document.getElementById('debugLogs');

      Homey.get('debugLogs', function (err, value) {
        if (!err) el.checked = !!value;
        Homey.ready();
      });

      el.addEventListener('change', function () {
        Homey.set('debugLogs', el.checked, function (err) {
          if (err) return Homey.alert(err);
        });
      });
    }
  </script>
</body>
</html>
